version: 1
defaults:
  unknown_action: deny
  unknown_destination: deny
rules:
  - id: deny-credential-upload
    priority: 100
    effect: deny
    operations: [network_upload, network_request]
    source_classes: [credential_file, private_key]
  - id: approve-external-upload
    priority: 80
    effect: require_approval
    operations: [network_upload, network_request]
    destination_classes: [external_untrusted]
  - id: approve-local-tests
    priority: 50
    effect: require_approval
    operations: [test_execution]
    destination_classes: [none]
  - id: allow-structured-file-read
    effect: allow
    operations: [file_read]
    tools: [read_file]
  - id: approve-structured-file-search
    effect: require_approval
    operations: [file_search]
    tools: [search_files]
  - id: approve-structured-web-read
    effect: require_approval
    operations: [web_read]
    tools: [web_search, web_extract]
  - id: approve-local-network-read
    effect: require_approval
    operations: [network_request]
    destination_classes: [local_or_private]
