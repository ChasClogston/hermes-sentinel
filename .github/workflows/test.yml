name: Sentinel tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install plugin and Hermes YAML runtime dependency
        run: |
          python -m pip install -e .
          python -m pip install 'ruamel.yaml>=0.18,<0.19'
      - name: Fetch exact Hermes YAML compatibility module for CI
        run: |
          mkdir -p .ci-hermes
          curl --fail --silent --show-error --location --max-time 30 \
            https://raw.githubusercontent.com/NousResearch/hermes-agent/2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19/hermes_yaml.py \
            --output .ci-hermes/hermes_yaml.py
      - name: Unit tests
        env:
          PYTHONPATH: .ci-hermes
        run: python -m unittest discover -s tests -v
      - name: Synthetic hook smoke
        env:
          PYTHONPATH: .ci-hermes
        run: python demo/hook_smoke.py
      - name: Report CLI smoke
        env:
          PYTHONPATH: .ci-hermes
        run: |
          python -m sentinel.cli report --days 7
          python demo/report_smoke.py
